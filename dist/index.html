<html lang="zh-Hant">
<head>

  <meta name="description" content="PocketFlow 個人記帳與訂閱管理"><title>PocketFlow｜個人記帳</title>
  <style>
    :root{--ink:#17232c;--muted:#6c7a83;--paper:#f5f7f4;--card:#fff;--line:#dce4df;--teal:#126f64;--mint:#d9f0e6;--orange:#ee8c45;--red:#c84f4d;--nav:#10261f}*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:ui-sans-serif,system-ui,"Noto Sans TC",sans-serif;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer;border:0}.shell{display:grid;grid-template-columns:244px 1fr;min-height:100vh}.side{background:var(--nav);color:#edf5ee;padding:28px 16px;display:flex;flex-direction:column;gap:20px}.brand{font-size:23px;font-weight:800;letter-spacing:-1px;padding:0 12px}.brand b{color:#76d4bb}.brand small{display:block;font-size:11px;font-weight:500;letter-spacing:.04em;color:#a4bbb1;margin-top:4px}.nav{display:grid;gap:5px}.nav button{background:transparent;color:#bcd0c7;text-align:left;padding:12px;border-radius:10px}.nav button.active,.nav button:hover{background:#234238;color:#fff}.nav button span{display:inline-block;width:28px}.side-foot{margin-top:auto;border-top:1px solid #315247;padding:16px 12px;color:#a4bbb1;font-size:12px}.main{max-width:1440px;width:100%;margin:auto;padding:32px 42px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.eyebrow{color:var(--teal);font-size:13px;font-weight:700;letter-spacing:.06em}.top h1{margin:4px 0 0;font-size:29px;letter-spacing:-.8px}.actions{display:flex;gap:10px}.primary,.secondary,.icon-btn{border-radius:9px;padding:10px 14px;font-weight:700}.primary{background:var(--teal);color:white}.primary:hover{background:#0b584f}.secondary{background:white;border:1px solid var(--line);color:var(--ink)}.overview{display:grid;grid-template-columns:1.15fr repeat(3,1fr);gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 3px 12px #183c2b08}.feature{background:linear-gradient(140deg,#174d43,#126f64);color:white}.label{font-size:13px;color:var(--muted);font-weight:650}.feature .label{color:#b4ddd0}.amount{font-size:28px;font-weight:800;letter-spacing:-1px;margin:8px 0}.hint{font-size:12px;color:var(--muted)}.feature .hint{color:#c9e5db}.positive{color:#15805e}.negative{color:var(--red)}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;margin-top:18px}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.section-head h2{font-size:16px;margin:0}.section-head button{color:var(--teal);background:none;font-size:13px;font-weight:700}.chart{height:178px;display:flex;align-items:end;gap:14px;padding:12px 4px 0;border-bottom:1px solid var(--line)}.bar-wrap{flex:1;text-align:center;color:var(--muted);font-size:11px}.bar{background:linear-gradient(#76c9b3,#1a806f);border-radius:7px 7px 2px 2px;margin-bottom:8px;min-height:8px}.categories{display:grid;gap:14px}.cat-row{display:grid;grid-template-columns:32px 1fr auto;align-items:center;gap:9px}.badge{height:31px;width:31px;display:grid;place-items:center;background:#eff5f2;border-radius:9px}.progress{height:7px;background:#eef2ef;border-radius:99px;margin-top:7px;overflow:hidden}.progress i{display:block;height:100%;background:var(--teal);border-radius:99px}.progress.warn i{background:var(--orange)}.list{display:grid;gap:3px}.transaction{display:grid;grid-template-columns:38px 1fr auto;align-items:center;padding:11px 3px;border-bottom:1px solid #edf0ee}.transaction:last-child{border:0}.transaction strong{font-size:14px}.transaction small{display:block;color:var(--muted);font-size:12px;margin-top:3px}.page{display:none}.page.active{display:block}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters input,.filters select{background:white;border:1px solid var(--line);padding:9px 10px;border-radius:8px;color:var(--ink)}.table-card{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:14px}.table th{text-align:left;color:var(--muted);font-size:12px;padding:11px;border-bottom:1px solid var(--line)}.table td{padding:14px 11px;border-bottom:1px solid #edf0ee}.type{padding:4px 8px;border-radius:99px;background:#fff1e7;color:#ab5d2c;font-size:11px;font-weight:700}.type.income{background:#e7f5ed;color:#27825d}.budget-list,.subscription-list{display:grid;gap:13px}.budget-item,.sub-item{padding:16px;border:1px solid var(--line);border-radius:12px;background:white}.budget-item header,.sub-item header{display:flex;justify-content:space-between;align-items:center}.budget-item p,.sub-item p{color:var(--muted);font-size:13px;margin:7px 0}.account-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.account{background:white;border:1px solid var(--line);padding:18px;border-radius:14px}.account .icon{font-size:20px}.account h3{margin:10px 0 4px;font-size:15px}.empty{color:var(--muted);padding:28px;text-align:center}.modal{position:fixed;inset:0;background:#10261f82;display:none;place-items:center;padding:20px;z-index:5}.modal.open{display:grid}.dialog{width:min(560px,100%);max-height:90vh;overflow:auto;background:white;border-radius:18px;padding:24px;box-shadow:0 20px 50px #07130e55}.dialog h2{margin:0 0 18px}.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}.form label{display:grid;gap:6px;font-size:13px;font-weight:650}.form input,.form select,.form textarea{padding:10px;border-radius:8px;border:1px solid var(--line);min-width:0}.form textarea{resize:vertical;min-height:72px}.wide{grid-column:1/-1}.dialog-foot{display:flex;justify-content:flex-end;gap:9px;margin-top:21px}.toast{position:fixed;right:22px;bottom:22px;background:#163c32;color:white;padding:13px 16px;border-radius:10px;display:none;box-shadow:0 8px 25px #0003}.toast.show{display:block}@media(max-width:820px){.shell{display:block}.side{position:sticky;top:0;z-index:3;padding:10px 12px;display:flex;flex-direction:row;align-items:center}.brand{padding:0;font-size:18px}.brand small,.side-foot{display:none}.nav{margin-left:auto;display:flex;gap:2px}.nav button{font-size:0;padding:9px}.nav button span{font-size:18px;width:auto}.main{padding:22px 16px}.overview,.grid{grid-template-columns:1fr}.overview{gap:10px}.top{align-items:flex-start}.top h1{font-size:24px}.actions .secondary{display:none}.form{grid-template-columns:1fr}.wide{grid-column:auto}.table th:nth-child(3),.table td:nth-child(3){display:none}}
    /* Navigation and interactive-element refinements */
    body{font-family:"Aptos","Noto Sans TC","Microsoft JhengHei",ui-sans-serif,system-ui,sans-serif;letter-spacing:.01em}
    .side{padding:30px 14px 20px;background:linear-gradient(180deg,#102d25 0%,#0b211a 100%);box-shadow:inset -1px 0 #ffffff12}
    .brand{font-family:"Aptos Display","Noto Sans TC",sans-serif;font-size:25px;letter-spacing:-1.2px;padding:0 14px 5px}
    .nav{gap:7px;padding:2px 0}
    .nav button{position:relative;display:flex;align-items:center;gap:8px;width:100%;min-height:45px;padding:11px 13px;border:1px solid transparent;border-radius:12px;font-size:14px;font-weight:650;letter-spacing:.025em;transition:background .18s ease,color .18s ease,transform .18s ease,border-color .18s ease,box-shadow .18s ease}
    .nav button span{display:grid;place-items:center;width:23px;font-size:17px;line-height:1}
    .nav button:hover{background:#264c40;color:#fff;border-color:#51796c;transform:translateX(2px)}
    .nav button.active{background:linear-gradient(100deg,#287b6a,#1d6557);color:#fff;border-color:#4eaa94;box-shadow:0 8px 16px #04130d66;font-weight:750}
    .nav button.active::before{content:"";position:absolute;left:-14px;width:4px;height:22px;border-radius:0 5px 5px 0;background:#8be3c9;box-shadow:0 0 14px #8be3c9aa}
    button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #84d9c2;outline-offset:3px}
    .primary,.secondary{transition:transform .16s ease,box-shadow .16s ease,background .16s ease}
    .primary:hover{transform:translateY(-1px);box-shadow:0 7px 14px #126f6433}.secondary:hover{background:#f5faf7;box-shadow:0 4px 11px #14281e12}
    .primary:active,.secondary:active,.nav button:active{transform:translateY(1px) scale(.985)}
    .section-head h2,.top h1{font-family:"Aptos Display","Noto Sans TC",sans-serif;font-weight:760}
    @media(max-width:820px){.side{padding:9px 10px;background:#102d25}.brand{font-size:19px;padding:0 4px}.nav button{min-height:39px;padding:8px 9px;border-radius:10px}.nav button.active::before{display:none}.nav button:hover{transform:none}.nav button.active{box-shadow:none}.nav button span{font-size:19px}}
    /* Custom dropdowns: native menus cannot be styled consistently across browsers */
    select.enhanced-native{position:absolute!important;opacity:0!important;pointer-events:none!important;width:1px!important;height:1px!important}
    .custom-select{position:relative;width:100%;font-size:14px}.select-trigger{width:100%;min-height:42px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 13px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);text-align:left;font-weight:560;transition:border-color .16s ease,box-shadow .16s ease,background .16s ease}.select-trigger::after{content:"";width:7px;height:7px;margin:0 3px 3px 10px;border-right:2px solid #277e6d;border-bottom:2px solid #277e6d;border-radius:1px;transform:rotate(45deg);transition:transform .18s ease,margin .18s ease,border-color .18s ease}.custom-select.open .select-trigger{border-color:#56ab96;box-shadow:0 0 0 3px #7bd1bc36;background:#fbfffd}.custom-select.open .select-trigger::after{margin:3px 3px 0 10px;transform:rotate(225deg);border-color:#075b4e}.select-menu{position:absolute;z-index:20;top:calc(100% + 7px);left:0;right:0;display:none;max-height:230px;overflow:auto;padding:6px;background:#fff;border:1px solid #c9dfd6;border-radius:11px;box-shadow:0 14px 30px #0b2a2030}.custom-select.open .select-menu{display:grid;gap:2px;animation:dropdown-in .14s ease both}.select-option{width:100%;padding:10px 11px;border-radius:7px;background:transparent;color:var(--ink);text-align:left;font-size:14px}.select-option:hover,.select-option:focus-visible{background:#e6f5ef;color:#0a554a;outline:none}.select-option.selected{background:#d5eee4;color:#075b4e;font-weight:750}.filters .custom-select{width:142px}.form label>.custom-select{margin-top:0}@keyframes dropdown-in{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
    .day-group td{padding:21px 11px 8px;border-bottom:0;background:linear-gradient(90deg,#edf6f1,#f9fcfa)}.day-group:first-child td{padding-top:12px}.day-heading{display:flex;justify-content:space-between;align-items:baseline;gap:12px;color:#173c31}.day-heading strong{font-size:14px}.day-heading span{font-size:12px;color:var(--teal);font-weight:700}.day-group+tr td{border-top:1px solid #dcebe4}.keep-adding{color:var(--teal);border-color:#9bcec0}
  </style>
</head>
<body><div class="shell"><aside class="side"><div class="brand">Pocket<b>Flow</b><small>你的金流，一目了然</small></div><nav class="nav"><button class="active" data-page="dashboard"><span>▦</span>儀表板</button><button data-page="transactions"><span>↕</span>交易紀錄</button><button data-page="budgets"><span>◔</span>預算管理</button><button data-page="subscriptions"><span>◌</span>訂閱管理</button><button data-page="accounts"><span>▣</span>帳戶</button></nav><div class="side-foot">本機展示版<br>資料僅儲存在此瀏覽器</div></aside><main class="main">
<section class="page active" id="dashboard"><div class="top"><div><div class="eyebrow">2026 年 10 月</div><h1>早安，這個月花得剛剛好。</h1></div><div class="actions"><button class="secondary" onclick="exportCSV()">匯出 CSV</button><button class="primary" onclick="openModal('transaction')">＋ 新增交易</button></div></div><div class="overview" id="kpis"></div><div class="grid"><article class="card"><div class="section-head"><h2>近 7 日支出</h2><span class="hint">TWD</span></div><div class="chart" id="chart"></div></article><article class="card"><div class="section-head"><h2>分類支出</h2><button onclick="go('transactions')">查看明細</button></div><div class="categories" id="categories"></div></article><article class="card"><div class="section-head"><h2>預算進度</h2><button onclick="go('budgets')">管理預算</button></div><div class="categories" id="budgetPreview"></div></article><article class="card"><div class="section-head"><h2>最近交易</h2><button onclick="go('transactions')">全部交易</button></div><div class="list" id="recent"></div></article></div></section>
<section class="page" id="transactions"><div class="top"><div><div class="eyebrow">收支明細</div><h1>交易紀錄</h1></div><button class="primary" onclick="openModal('transaction')">＋ 新增交易</button></div><div class="toolbar"><div class="filters"><input id="search" oninput="renderTransactions()" placeholder="搜尋描述或分類"><select id="filterType" onchange="renderTransactions()"><option value="">所有類型</option><option value="expense">支出</option><option value="income">收入</option></select></div><span class="hint" id="transactionCount"></span></div><article class="card table-card"><table class="table"><thead><tr><th>日期</th><th>項目</th><th>帳戶</th><th>分類</th><th>金額</th></tr></thead><tbody id="transactionRows"></tbody></table></article></section>
<section class="page" id="budgets"><div class="top"><div><div class="eyebrow">2026 年 10 月</div><h1>預算管理</h1></div><button class="primary" onclick="openModal('budget')">＋ 設定預算</button></div><div class="budget-list" id="budgetList"></div></section>
<section class="page" id="subscriptions"><div class="top"><div><div class="eyebrow">固定支出</div><h1>訂閱管理</h1></div><button class="primary" onclick="openModal('subscription')">＋ 新增訂閱</button></div><div class="overview" style="grid-template-columns:repeat(2,1fr);margin-bottom:18px" id="subscriptionKpis"></div><div class="subscription-list" id="subscriptionList"></div></section>
<section class="page" id="accounts"><div class="top"><div><div class="eyebrow">付款來源</div><h1>帳戶管理</h1></div><button class="primary" onclick="openModal('account')">＋ 新增帳戶</button></div><div class="account-grid" id="accountGrid"></div></section>
</main></div>
<div class="modal" id="modal"><div class="dialog"><h2 id="modalTitle"></h2><form id="form" onsubmit="save(event)"><div id="formFields" class="form"></div><div class="dialog-foot"><button class="secondary" type="button" onclick="closeModal()">取消</button><span id="formActions"><button class="primary" type="submit">儲存</button></span></div></form></div></div><div class="toast" id="toast"></div>
<script>
const icons={食物:'🍜',交通:'🚇',日常:'☀️',娛樂:'🎬',住居:'⌂',醫療:'✚',薪資:'✦',其他:'◦'};
const initial={accounts:[{id:1,name:'日常銀行帳戶',type:'銀行帳戶',balance:28640},{id:2,name:'現金錢包',type:'現金',balance:1250},{id:3,name:'玉山信用卡',type:'信用卡',balance:-4620}],transactions:[{id:1,date:'2026-10-29',desc:'公司附近午餐',category:'食物',account:'日常銀行帳戶',amount:180,type:'expense'},{id:2,date:'2026-10-28',desc:'捷運往返台北',category:'交通',account:'悠遊卡',amount:60,type:'expense'},{id:3,date:'2026-10-28',desc:'十月薪資',category:'薪資',account:'日常銀行帳戶',amount:52000,type:'income'},{id:4,date:'2026-10-27',desc:'串流影集',category:'娛樂',account:'玉山信用卡',amount:390,type:'expense'},{id:5,date:'2026-10-26',desc:'超市採買',category:'日常',account:'日常銀行帳戶',amount:735,type:'expense'},{id:6,date:'2026-10-25',desc:'咖啡與早餐',category:'食物',account:'現金錢包',amount:145,type:'expense'}],budgets:[{category:'食物',limit:6000},{category:'交通',limit:2000},{category:'日常',limit:5000},{category:'娛樂',limit:2500}],subscriptions:[{id:1,name:'Netflix',amount:390,cycle:'每月',next:'2026-11-03',account:'玉山信用卡',status:'啟用中'},{id:2,name:'iCloud+',amount:90,cycle:'每月',next:'2026-11-08',account:'日常銀行帳戶',status:'啟用中'},{id:3,name:'Spotify',amount:149,cycle:'每月',next:'2026-11-12',account:'玉山信用卡',status:'啟用中'}]};
let state=JSON.parse(localStorage.getItem('pocketflow-v1')||'null')||initial, currentForm='';const money=n=>new Intl.NumberFormat('zh-TW',{style:'currency',currency:'TWD',maximumFractionDigits:0}).format(n);const saveState=()=>localStorage.setItem('pocketflow-v1',JSON.stringify(state));const expense=()=>state.transactions.filter(t=>t.type==='expense').reduce((a,t)=>a+t.amount,0);const income=()=>state.transactions.filter(t=>t.type==='income').reduce((a,t)=>a+t.amount,0);const byCat=()=>state.transactions.filter(t=>t.type==='expense').reduce((o,t)=>(o[t.category]=(o[t.category]||0)+t.amount,o),{});
function go(page){document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));document.querySelectorAll('.nav button').forEach(e=>e.classList.toggle('active',e.dataset.page===page));document.getElementById(page).classList.add('active');render()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));
function render(){renderDashboard();renderTransactions();renderBudgets();renderSubscriptions();renderAccounts();enhanceSelects()}
function renderDashboard(){let e=expense(),i=income(),b=byCat(),remaining=state.budgets.reduce((sum,x)=>sum+x.limit,0)-e;document.getElementById('kpis').innerHTML=`<div class="card feature"><div class="label">本月總支出</div><div class="amount">${money(e)}</div><div class="hint">較上月少 8.4%</div></div><div class="card"><div class="label">本月收入</div><div class="amount">${money(i)}</div><div class="hint positive">收支流入穩定</div></div><div class="card"><div class="label">淨現金流</div><div class="amount">${money(i-e)}</div><div class="hint positive">本月有盈餘</div></div><div class="card"><div class="label">剩餘預算</div><div class="amount">${money(remaining)}</div><div class="hint">4 個分類已設定</div></div>`;let days=['23','24','25','26','27','28','29'],vals=[190,420,145,735,390,60,180],max=Math.max(...vals);document.getElementById('chart').innerHTML=days.map((d,n)=>`<div class="bar-wrap"><div class="bar" style="height:${vals[n]/max*130}px"></div>${d} 日</div>`).join('');document.getElementById('categories').innerHTML=Object.entries(b).sort((a,b)=>b[1]-a[1]).map(([c,a])=>`<div class="cat-row"><div class="badge">${icons[c]||'◦'}</div><div><strong>${c}</strong><div class="progress"><i style="width:${Math.min(100,a/e*100)}%"></i></div></div><strong>${money(a)}</strong></div>`).join('');document.getElementById('budgetPreview').innerHTML=state.budgets.map(x=>{let used=b[x.category]||0,p=used/x.limit*100;return `<div><div class="section-head" style="margin:0"><strong>${x.category}</strong><span class="hint">${money(used)} / ${money(x.limit)}</span></div><div class="progress ${p>=80?'warn':''}"><i style="width:${Math.min(p,100)}%"></i></div></div>`}).join('');document.getElementById('recent').innerHTML=state.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4).map(t=>`<div class="transaction"><div class="badge">${icons[t.category]||'◦'}</div><div><strong>${t.desc}</strong><small>${t.date} · ${t.category}</small></div><strong class="${t.type==='income'?'positive':''}">${t.type==='income'?'+':'-'}${money(t.amount)}</strong></div>`).join('')}
function renderTransactions(){let q=(document.getElementById('search')?.value||'').toLowerCase(),f=document.getElementById('filterType')?.value||'';let list=state.transactions.filter(t=>(!q||`${t.desc}${t.category}`.toLowerCase().includes(q))&&(!f||t.type===f)).sort((a,b)=>b.date.localeCompare(a.date));document.getElementById('transactionCount').textContent=`${list.length} 筆紀錄 · 依日期整理`;let days={};list.forEach(t=>(days[t.date]??=[]).push(t));document.getElementById('transactionRows').innerHTML=Object.entries(days).map(([date,items])=>{let spent=items.filter(x=>x.type==='expense').reduce((n,x)=>n+x.amount,0),earned=items.filter(x=>x.type==='income').reduce((n,x)=>n+x.amount,0),summary=`支出 ${money(spent)}${earned?` · 收入 ${money(earned)}`:''}`;return `<tr class="day-group"><td colspan="5"><div class="day-heading"><strong>${date} · ${date==='2026-10-29'?'今天':''}</strong><span>${summary}</span></div></td></tr>`+items.map(t=>`<tr><td></td><td><strong>${t.desc}</strong></td><td>${t.account}</td><td><span class="type ${t.type==='income'?'income':''}">${t.category}</span></td><td class="${t.type==='income'?'positive':''}"><strong>${t.type==='income'?'+':'-'}${money(t.amount)}</strong></td></tr>`).join('')}).join('')||'<tr><td colspan="5" class="empty">找不到符合的交易</td></tr>'}
function renderBudgets(){let b=byCat();document.getElementById('budgetList').innerHTML=state.budgets.map(x=>{let used=b[x.category]||0,p=used/x.limit*100;return `<article class="budget-item"><header><strong>${icons[x.category]||'◦'}　${x.category}</strong><strong class="${p>100?'negative':p>=80?'':'positive'}">${Math.round(p)}%</strong></header><p>已使用 ${money(used)}，預算上限 ${money(x.limit)}</p><div class="progress ${p>=80?'warn':''}"><i style="width:${Math.min(p,100)}%"></i></div></article>`}).join('')||'<div class="empty">尚未設定預算</div>'}
function renderSubscriptions(){let total=state.subscriptions.filter(s=>s.status==='啟用中').reduce((a,s)=>a+s.amount,0);document.getElementById('subscriptionKpis').innerHTML=`<div class="card feature"><div class="label">平均月成本</div><div class="amount">${money(total)}</div><div class="hint">${state.subscriptions.filter(s=>s.status==='啟用中').length} 個啟用中的訂閱</div></div><div class="card"><div class="label">下一筆扣款</div><div class="amount">11/03</div><div class="hint">Netflix · ${money(390)}</div></div>`;document.getElementById('subscriptionList').innerHTML=state.subscriptions.map(s=>`<article class="sub-item"><header><div><strong>${s.name}</strong><p>${s.cycle} · ${s.account}</p></div><div style="text-align:right"><strong>${money(s.amount)}</strong><p>${s.status}</p></div></header><div class="hint">下次扣款：${s.next}</div></article>`).join('')||'<div class="empty">還沒有訂閱項目</div>'}
function renderAccounts(){document.getElementById('accountGrid').innerHTML=state.accounts.map(a=>`<article class="account"><div class="icon">${a.type==='信用卡'?'▣':a.type==='現金'?'◫':'◇'}</div><h3>${a.name}</h3><div class="hint">${a.type}</div><div class="amount" style="font-size:22px">${money(a.balance)}</div></article>`).join('')}
function openModal(kind,preset={}){currentForm=kind;let title={transaction:'新增交易',budget:'設定分類預算',subscription:'新增訂閱',account:'新增帳戶'}[kind],fields={transaction:`<label>類型<select name="type"><option value="expense">支出</option><option value="income">收入</option></select></label><label>金額<input name="amount" type="number" min="1" required placeholder="例如 180"></label><label>分類<select name="category">${['食物','交通','日常','娛樂','住居','醫療','其他','薪資'].map(x=>`<option>${x}</option>`).join('')}</select></label><label>帳戶<select name="account">${state.accounts.map(a=>`<option>${a.name}</option>`).join('')}</select></label><label>日期<input name="date" type="date" value="2026-10-29" required></label><label class="wide">描述<input name="desc" maxlength="500" required placeholder="例：公司附近午餐"></label>`,budget:`<label>分類<select name="category">${['食物','交通','日常','娛樂','住居','醫療','其他'].map(x=>`<option>${x}</option>`).join('')}</select></label><label>本月預算<input name="limit" type="number" min="1" required placeholder="例如 6000"></label>`,subscription:`<label>服務名稱<input name="name" required placeholder="例如 Netflix"></label><label>每期金額<input name="amount" type="number" min="1" required></label><label>計費週期<select name="cycle"><option>每月</option><option>每年</option><option>每週</option></select></label><label>付款帳戶<select name="account">${state.accounts.map(a=>`<option>${a.name}</option>`).join('')}</select></label><label>下次扣款日<input name="next" type="date" value="2026-11-01" required></label>`,account:`<label>帳戶名稱<input name="name" required placeholder="例如 日常銀行帳戶"></label><label>帳戶類型<select name="type"><option>銀行帳戶</option><option>現金</option><option>信用卡</option><option>電子支付</option></select></label><label class="wide">起始餘額<input name="balance" type="number" value="0" required></label>`}[kind];document.getElementById('modalTitle').textContent=title;document.getElementById('formFields').innerHTML=fields;document.getElementById('formActions').innerHTML=kind==='transaction'?'<button class="secondary keep-adding" type="submit" data-more="true">儲存並再記一筆</button><button class="primary" type="submit">儲存</button>':'<button class="primary" type="submit">儲存</button>';Object.entries(preset).forEach(([key,value])=>{let field=document.querySelector(`#form [name="${key}"]`);if(field)field.value=value});enhanceSelects();document.getElementById('modal').classList.add('open')}
function enhanceSelects(){document.querySelectorAll('select:not([data-enhanced])').forEach(select=>{select.dataset.enhanced='true';select.classList.add('enhanced-native');let wrap=document.createElement('div');wrap.className='custom-select';let trigger=document.createElement('button');trigger.type='button';trigger.className='select-trigger';let menu=document.createElement('div');menu.className='select-menu';menu.setAttribute('role','listbox');const refresh=()=>{trigger.textContent=select.options[select.selectedIndex]?.text||'請選擇';menu.querySelectorAll('.select-option').forEach((item,i)=>item.classList.toggle('selected',i===select.selectedIndex))};Array.from(select.options).forEach((option,index)=>{let item=document.createElement('button');item.type='button';item.className='select-option';item.textContent=option.text;item.setAttribute('role','option');item.onclick=()=>{select.selectedIndex=index;select.dispatchEvent(new Event('change',{bubbles:true}));refresh();wrap.classList.remove('open')};menu.append(item)});trigger.onclick=()=>{document.querySelectorAll('.custom-select.open').forEach(x=>{if(x!==wrap)x.classList.remove('open')});wrap.classList.toggle('open')};select.after(wrap);wrap.append(trigger,menu);select.addEventListener('change',refresh);refresh()})}
document.addEventListener('click',event=>{if(!event.target.closest('.custom-select'))document.querySelectorAll('.custom-select.open').forEach(x=>x.classList.remove('open'))});
function closeModal(){document.getElementById('modal').classList.remove('open')}function save(e){e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),keepAdding=e.submitter?.dataset.more==='true';if(currentForm==='transaction'){d.id=Date.now();d.amount=Number(d.amount);state.transactions.unshift(d)}if(currentForm==='budget'){d.limit=Number(d.limit);let old=state.budgets.find(x=>x.category===d.category);old?old.limit=d.limit:state.budgets.push(d)}if(currentForm==='subscription'){d.id=Date.now();d.amount=Number(d.amount);d.status='啟用中';state.subscriptions.push(d)}if(currentForm==='account'){d.id=Date.now();d.balance=Number(d.balance);state.accounts.push(d)}saveState();closeModal();render();toast('已儲存到本機資料');if(keepAdding&&currentForm==='transaction')openModal('transaction',{type:d.type,account:d.account,date:d.date})}
function toast(msg){let e=document.getElementById('toast');e.textContent=msg;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2600)}function exportCSV(){let rows=[['日期','類型','描述','分類','帳戶','金額'],...state.transactions.map(t=>[t.date,t.type,t.desc,t.category,t.account,t.amount])];let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='pocketflow-transactions.csv';a.click();URL.revokeObjectURL(a.href);toast('CSV 已下載')};render();
</script></body></html>
