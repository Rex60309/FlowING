<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="PocketFlow 個人記帳與訂閱管理">
  <title>PocketFlow｜個人記帳</title>
  <link rel="stylesheet" href="assets/styles.css">
  <script src="assets/app.js" defer></script>
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="brand">Pocket<b>Flow</b><small>你的金流，一目了然</small></div>
      <nav class="nav">
        <button class="active" data-page="dashboard"><span>▦</span>儀表板</button>
        <button data-page="transactions"><span>↕</span>交易紀錄</button>
        <button data-page="budgets"><span>◔</span>預算管理</button>
        <button data-page="subscriptions"><span>◌</span>訂閱管理</button>
        <button data-page="accounts"><span>▣</span>帳戶</button>
      </nav>
      <div class="side-foot">本機展示版<br>資料僅儲存在此瀏覽器</div>
    </aside>
    <main class="main">
      <section class="page active" id="dashboard">
        <div class="top"><div><div class="eyebrow">2026 年 10 月</div><h1>早安，這個月花得剛剛好。</h1></div><div class="actions"><button class="secondary" onclick="exportCSV()">匯出 CSV</button><button class="primary" onclick="openModal('transaction')">＋ 新增交易</button></div></div>
        <div class="overview" id="kpis"></div>
        <div class="grid">
          <article class="card"><div class="section-head"><h2>近 7 日支出</h2><span class="hint">TWD</span></div><div class="chart" id="chart"></div></article>
          <article class="card"><div class="section-head"><h2>分類支出</h2><button onclick="go('transactions')">查看明細</button></div><div class="categories" id="categories"></div></article>
          <article class="card"><div class="section-head"><h2>預算進度</h2><button onclick="go('budgets')">管理預算</button></div><div class="categories" id="budgetPreview"></div></article>
          <article class="card"><div class="section-head"><h2>最近交易</h2><button onclick="go('transactions')">全部交易</button></div><div class="list" id="recent"></div></article>
        </div>
      </section>
      <section class="page" id="transactions">
        <div class="top"><div><div class="eyebrow">收支明細</div><h1>交易紀錄</h1></div><button class="primary" onclick="openModal('transaction')">＋ 新增交易</button></div>
        <div class="toolbar"><div class="filters"><input id="search" oninput="renderTransactions()" placeholder="搜尋描述或分類"><select id="filterType" onchange="renderTransactions()"><option value="">所有類型</option><option value="expense">支出</option><option value="income">收入</option></select></div><span class="hint" id="transactionCount"></span></div>
        <article class="card table-card"><table class="table"><thead><tr><th>日期</th><th>項目</th><th>帳戶</th><th>分類</th><th>金額</th></tr></thead><tbody id="transactionRows"></tbody></table></article>
      </section>
      <section class="page" id="budgets"><div class="top"><div><div class="eyebrow">2026 年 10 月</div><h1>預算管理</h1></div><button class="primary" onclick="openModal('budget')">＋ 設定預算</button></div><div class="budget-list" id="budgetList"></div></section>
      <section class="page" id="subscriptions"><div class="top"><div><div class="eyebrow">固定支出</div><h1>訂閱管理</h1></div><button class="primary" onclick="openModal('subscription')">＋ 新增訂閱</button></div><div class="overview" style="grid-template-columns:repeat(2,1fr);margin-bottom:18px" id="subscriptionKpis"></div><div class="subscription-list" id="subscriptionList"></div></section>
      <section class="page" id="accounts"><div class="top"><div><div class="eyebrow">付款來源</div><h1>帳戶管理</h1></div><button class="primary" onclick="openModal('account')">＋ 新增帳戶</button></div><div class="account-grid" id="accountGrid"></div></section>
    </main>
  </div>
  <div class="modal" id="modal"><div class="dialog"><h2 id="modalTitle"></h2><form id="form" onsubmit="save(event)"><div id="formFields" class="form"></div><div class="dialog-foot"><button class="secondary" type="button" onclick="closeModal()">取消</button><span id="formActions"><button class="primary" type="submit">儲存</button></span></div></form></div></div>
  <div class="toast" id="toast"></div>
</body>
</html>
